version: '3.8'

services:
  # -------------------------------------------------------------
  # Apache Kafka with KRaft (No Zookeeper required for modern reliability)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: icestream-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icestream-net

  # Kafka Topic Initialization Job
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: icestream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "sh", "-c" ]
    command: |
      "
      echo -e 'Creating Kafka topics for IceStream...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout-events --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout-events-valid --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout-events-invalid --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout-events-dlq --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pipeline-events --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic quality-alerts --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic remediation-events --replication-factor 1 --partitions 3
      echo -e 'Successfully initialized Kafka topics.'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - icestream-net

  # Kafka UI for visual debugging of message streams
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: icestream-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-icestream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - icestream-net

  # -------------------------------------------------------------
  # MinIO (S3 Compatible Storage for Apache Iceberg Lakehouse)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: icestream-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icestream-net

  # MinIO Bucket Auto-Provisioning
  minio-init:
    image: minio/mc:RELEASE.2023-09-07T05-18-47Z
    container_name: icestream-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password123;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse;
      /usr/bin/mc anonymous set public myminio/lakehouse;
      exit 0;
      "
    networks:
      - icestream-net

  # -------------------------------------------------------------
  # Apache Iceberg REST Catalog
  # -------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:0.7.0
    container_name: icestream-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3__ENDPOINT: http://minio:9000
      CATALOG_S3__PATH_STYLE_ACCESS: "true"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - icestream-net

  # -------------------------------------------------------------
  # Apache Flink JobManager & TaskManager
  # -------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: icestream-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    networks:
      - icestream-net

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: icestream-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    networks:
      - icestream-net

  # -------------------------------------------------------------
  # IceStream Microservices
  # -------------------------------------------------------------
  # 1. Transaction Generator Service
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: icestream-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: checkout-events
      EVENTS_PER_SECOND: 250
      ANOMALY_RATE: 0.01
      SCHEMA_DRIFT_RATE: 0.005
      NULL_RATE: 0.01
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - icestream-net

  # 2. Data Quality & Observability Rules Engine
  quality-engine:
    build:
      context: ./quality-engine
      dockerfile: Dockerfile
    container_name: icestream-quality-engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      ERROR_RATE_THRESHOLD: 0.02
      CIRCUIT_BREAKER_RECOVERY_TIME_SEC: 15
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    networks:
      - icestream-net

  # 3. FastAPI & WebSockets Observability API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: icestream-api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      ERROR_RATE_THRESHOLD: 0.02
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    networks:
      - icestream-net

  # 4. React Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: icestream-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    depends_on:
      - api
    networks:
      - icestream-net

networks:
  icestream-net:
    driver: bridge
